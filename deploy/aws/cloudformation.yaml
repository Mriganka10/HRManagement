AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Kairoz HR Management - ECS Fargate web service behind an HTTPS ALB, RDS PostgreSQL 16,
  private encrypted S3 bucket for resumes/receipts/documents, SES email, Secrets Manager,
  CloudWatch logs and CPU autoscaling. See docs/AWS_DEPLOYMENT.md.

Parameters:
  AppName:
    Type: String
    Default: kairoz-hrm
    AllowedPattern: "[a-z0-9-]+"
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more public subnets (different AZs) for the load balancer.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more subnets (different AZs) for the app tasks and the database. Must reach the internet through a NAT gateway, or set AssignPublicIp=ENABLED and pass public subnets.
  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
  CertificateArn:
    Type: String
    Description: ACM certificate ARN (same region) for the portal domain, e.g. hr.kairoz.com.
  PublicBaseUrl:
    Type: String
    Description: The public URL people use, e.g. https://hr.kairoz.com (used in email links).
  ImageUri:
    Type: String
    Description: ECR image URI with tag, e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com/kairoz-hrm:2026-11-27-1
  EmailFrom:
    Type: String
    Description: SES-verified sender, e.g. "Kairoz HR <hr@kairoz.com>"
  BootstrapHrEmail:
    Type: String
    Default: ""
    Description: Optional. Email of the first HR administrator. Create the account with the CLI (see docs) - no password is generated in production.
  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
  MaxCount:
    Type: Number
    Default: 4
  TaskCpu:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048"]
  TaskMemory:
    Type: String
    Default: "2048"
    AllowedValues: ["1024", "2048", "4096"]
  DbInstanceClass:
    Type: String
    Default: db.t4g.small
  DbMultiAz:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  LlmApiKeySecretArn:
    Type: String
    Default: ""
    Description: Optional. Secrets Manager ARN holding an OpenAI-compatible API key (plain string) for the AI review layer.

Conditions:
  HasLlm: !Not [!Equals [!Ref LlmApiKeySecretArn, ""]]

Resources:
  # ------------------------------------------------------------------ secrets & storage
  AppSecretKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AppName}/secret-key"
      Description: Signs session cookies and hashes sign-in codes. Rotating it signs everyone out.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppName}-files-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 90 }

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt FilesBucket.Arn, !Sub "${FilesBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ------------------------------------------------------------------ network security
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AppName} load balancer"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AppName} app tasks"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSecurityGroup }

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AppName} database"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ServiceSecurityGroup }

  # ------------------------------------------------------------------ database
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AppName} database subnets"
      SubnetIds: !Ref PrivateSubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${AppName}-db"
      Engine: postgres
      EngineVersion: "16.15"          # pin a current minor; AutoMinorVersionUpgrade keeps it patched
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      MaxAllocatedStorage: 200
      StorageType: gp3
      StorageEncrypted: true
      DBName: hr_management
      MasterUsername: hrm
      ManageMasterUserPassword: true          # RDS keeps the password in Secrets Manager and can rotate it
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: !Ref DbMultiAz
      BackupRetentionPeriod: 7
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: true
      CopyTagsToSnapshot: true

  # ------------------------------------------------------------------ IAM
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppSecretKey
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !If [HasLlm, !Ref LlmApiKeySecretArn, !Ref AWS::NoValue]

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: app
          PolicyDocument:
            Statement:
              - Sid: Files
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${FilesBucket.Arn}/hrm/*"
              - Sid: Email
                Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: "*"
              - Sid: EcsExec   # lets admins run "python -m hr_management create-hr" inside a task
                Effect: Allow
                Action: [ssmmessages:CreateControlChannel, ssmmessages:CreateDataChannel, ssmmessages:OpenControlChannel, ssmmessages:OpenDataChannel]
                Resource: "*"

  # ------------------------------------------------------------------ load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AppName}-alb"
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "120" }        # interview scoring with the LLM layer can take a while
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 20
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  # ------------------------------------------------------------------ ECS
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AppName}"
      RetentionInDays: 30

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AppName}-cluster"
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AppName}-web"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 8000, Protocol: tcp }]
          ReadonlyRootFilesystem: false
          Environment:
            - { Name: HRM_ENVIRONMENT, Value: production }
            - { Name: HRM_PUBLIC_BASE_URL, Value: !Ref PublicBaseUrl }
            - { Name: HRM_COOKIE_SECURE, Value: "true" }
            - { Name: HRM_AWS_REGION, Value: !Ref AWS::Region }
            - { Name: HRM_STORAGE_BACKEND, Value: s3 }
            - { Name: HRM_S3_BUCKET, Value: !Ref FilesBucket }
            - { Name: HRM_S3_PREFIX, Value: hrm }
            - { Name: HRM_EMAIL_BACKEND, Value: ses }
            - { Name: HRM_EMAIL_FROM, Value: !Ref EmailFrom }
            - { Name: HRM_DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: HRM_DB_PORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: HRM_DB_NAME, Value: hr_management }
            - { Name: HRM_DB_SSLMODE, Value: require }
            - { Name: HRM_BOOTSTRAP_HR_EMAIL, Value: !Ref BootstrapHrEmail }
            - { Name: HRM_RATE_LIMITS, Value: "on" }
            - { Name: WEB_CONCURRENCY, Value: "2" }
          Secrets:
            - { Name: HRM_SECRET_KEY, ValueFrom: !Ref AppSecretKey }
            - { Name: HRM_DB_USER, ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:username::" }
            - { Name: HRM_DB_PASSWORD, ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::" }
            - !If [HasLlm, { Name: HRM_LLM_API_KEY, ValueFrom: !Ref LlmApiKeySecretArn }, !Ref AWS::NoValue]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: !Sub "${AppName}-web"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - { ContainerName: web, ContainerPort: 8000, TargetGroupArn: !Ref TargetGroup }

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${Service.Name}"
      MinCapacity: !Ref DesiredCount
      MaxCapacity: !Ref MaxCount

  CpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${AppName}-cpu"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  UnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "${AppName}: load balancer has unhealthy targets"
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "${AppName}: application returning 5xx errors"
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  LoadBalancerDnsName:
    Description: Point your domain (CNAME / Route 53 alias) at this.
    Value: !GetAtt LoadBalancer.DNSName
  FilesBucketName:
    Value: !Ref FilesBucket
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroup:
    Value: !Ref LogGroup
