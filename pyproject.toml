[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-management"
version = "2.0.0"
description = "Kairoz HR Management: AI recruitment (ATS, mock test, AI interview), onboarding and employee self-service HRMS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "requests>=2.31",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
aws = ["boto3>=1.34"]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
hr-management = "hr_management.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hr_management = ["templates/*.html", "static/css/*.css", "static/js/*.js", "static/img/*", "catalog/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
