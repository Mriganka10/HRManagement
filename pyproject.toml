[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-management"
version = "0.1.0"
description = "Agentic hiring pipeline: resume ATS screen, role-based mock test and mock interview with candidate emails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "requests>=2.31",
  "pypdf>=4.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
hr-management = "hr_management.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hr_management = ["templates/*.html", "static/css/*.css", "static/js/*.js", "catalog/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
