<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/static/css/app.css?v={{VERSION}}">
  <title>Set your password | {{COMPANY}}</title>
</head>
<body>
<div class="auth">
  <section class="auth-art">
    <a class="brand" href="/"><img src="/static/img/kairoz-logo-white.png" alt="{{COMPANY}} Corporation" height="40"></a>
    <div><h1>Make this account yours.</h1>
      <p class="lede">You signed in with a temporary password. Choose your own before continuing; it signs you out on every other device.</p></div>
    <span></span>
  </section>
  <section class="auth-panel">
    <div class="auth-card">
      <h2>Set a new password</h2>
      <p class="muted" id="who"></p>
      <form id="pw-form" novalidate>
        <label class="field">Current (temporary) password <input class="input" id="current" type="password" autocomplete="current-password" required></label>
        <label class="field">New password <input class="input" id="new" type="password" autocomplete="new-password" required></label>
        <ul class="pw-rules" id="rules"><li data-r="len">At least 10 characters</li><li data-r="mix">Letters and numbers</li><li data-r="match">Both new passwords match</li></ul>
        <label class="field">Repeat new password <input class="input" id="repeat" type="password" autocomplete="new-password" required></label>
        <button class="btn" type="submit" id="pw-btn">Save and continue</button>
        <button class="btn link" type="button" id="pw-logout">Sign out</button>
      </form>
    </div>
  </section>
</div>
<script src="/static/js/common.js?v={{VERSION}}"></script>
<script src="/static/js/auth.js?v={{VERSION}}"></script>
</body>
</html>
