name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: hrm
          POSTGRES_DB: hrm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrm" --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - name: Tests (${{ matrix.database }})
        env:
          HRM_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://hrm:hrm@localhost:5432/hrm_test' || '' }}
        run: pytest -q
      - name: JavaScript syntax
        run: for f in src/hr_management/static/js/*.js; do node --check "$f"; done

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t hr-management:ci .
      - name: Smoke test
        run: |
          docker run -d --name hrm -p 8000:8000 -e HRM_ENVIRONMENT=development -e HRM_SECRET_KEY=ci hr-management:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && exit 0; sleep 2; done
          docker logs hrm; exit 1

  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cfn-lint
      - run: cfn-lint deploy/aws/cloudformation.yaml --regions ap-south-1
